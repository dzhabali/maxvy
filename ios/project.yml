name: Vajra
options:
  bundleIdPrefix: com.maxdzhabali
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  knownRegions: [ru, en, Base]

settings:
  base:
    SWIFT_VERSION: "5.0"
    # страховка от дефолтов шаблонов Xcode 26+ (MainActor по умолчанию / строгая concurrency)
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_STRICT_CONCURRENCY: minimal
    # Team ID аккаунта Diamond Wisdom Group OU (не секрет)
    DEVELOPMENT_TEAM: F8H3UK3UF7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Vajra:
    type: application
    platform: iOS
    sources:
      - path: Vajra
      - path: Shared
    dependencies:
      - target: VajraWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxdzhabali.vajra
        PRODUCT_NAME: Vajra
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Vajra App Store
    entitlements:
      path: Vajra/Vajra.entitlements
      properties:
        com.apple.security.application-groups: [group.com.maxdzhabali.vajra]
    info:
      path: Vajra/Info.plist
      properties:
        CFBundleDisplayName: Ваджра
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        CFBundleAllowMixedLocalizations: true
        INAlternativeAppNames:
          - INAlternativeAppName: Vajra
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.maxdzhabali.vajra.pings]
    scheme:
      testTargets:
        - VajraTests

  VajraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VajraWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxdzhabali.vajra.widgets
        PRODUCT_NAME: VajraWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Vajra Widgets App Store
    entitlements:
      path: VajraWidgets/VajraWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.maxdzhabali.vajra]
    info:
      path: VajraWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ваджра
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VajraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VajraTests
    dependencies:
      - target: Vajra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxdzhabali.vajra.tests
        GENERATE_INFOPLIST_FILE: YES
